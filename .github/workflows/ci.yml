name: CI / Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No duplicated full release builds for superseded commits on the same branch.
concurrency:
  group: cluster-win-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Cached registry + compiled dependencies (debug/release independently).
      # Test and build both use release profile, so dependencies compile once.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cluster-win-release
          workspaces: ". -> target"
          cache-on-failure: true
          cache-all-crates: true
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format sources before build
        run: cargo fmt --all
      - name: Unit tests (release profile)
        run: cargo test --release --workspace
      - name: Build Windows desktop (release)
        run: cargo build --release -p cluster-app
      - name: Package portable Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/config | Out-Null
          Copy-Item target/release/megane-digital-cluster.exe dist/megane-digital-cluster.exe
          Copy-Item config/cluster.toml dist/config/cluster.toml
          Copy-Item docs/NOTICE_SECURITE.md dist/NOTICE_SECURITE.txt
      - name: Upload executable and config
        uses: actions/upload-artifact@v4
        with:
          name: megane-digital-cluster-windows-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 21
